# This file is provided for completeness if you want to run Nginx via Docker instead of natively on the EC2 host.
# Our current Terraform setup installs Nginx natively on the host via user-data.sh.
# If you prefer to containerize Nginx, you would add an nginx service to docker-compose.yml and mount this config.

server {
    listen 80;
    listen [::]:80;
    server_name _; # Matches any hostname

    location / {
        proxy_pass http://web:3000; # Points to the Next.js docker container
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }
}
